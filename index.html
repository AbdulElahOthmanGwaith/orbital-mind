<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orbital Mind | نظام العقل المداري</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0B0E14;
            --bg-secondary: #0F1219;
            --accent-primary: #6366F1;
            --accent-secondary: #8B5CF6;
            --accent-cyan: #22D3EE;
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --border-color: rgba(99, 102, 241, 0.2);
            --glow-primary: rgba(99, 102, 241, 0.5);
            --transition-normal: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Cairo', 'Tajawal', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .space-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 100%);
        }

        .stars {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 100px 150px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 200px 50px, #fff, transparent);
            background-size: 1000px 1000px;
            animation: starMove 200s linear infinite;
        }

        @keyframes starMove {
            from { transform: translate(0, 0); }
            to { transform: translate(-500px, -500px); }
        }

        #orbital-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }

        .top-hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(11, 14, 20, 0.9) 0%, transparent 100%);
            z-index: 100;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-orb {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
            border-radius: 50%;
            box-shadow: 0 0 20px var(--glow-primary);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); box-shadow: 0 0 15px var(--glow-primary); }
            to { transform: scale(1.1); box-shadow: 0 0 30px var(--accent-cyan); }
        }

        .project-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .contact-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(15, 18, 25, 0.8);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            z-index: 100;
            font-size: 0.9rem;
            line-height: 1.6;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .contact-info a {
            color: var(--accent-cyan);
            text-decoration: none;
            transition: var(--transition-normal);
        }

        .contact-info a:hover {
            color: var(--accent-primary);
            text-shadow: 0 0 10px var(--accent-primary);
        }

        .footer-rights {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-muted);
            font-size: 0.8rem;
            z-index: 100;
            text-align: center;
        }

        .control-panel {
            position: fixed;
            top: 100px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .btn {
            padding: 12px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background: var(--accent-primary);
            transform: translateX(-5px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .project-title { font-size: 1.2rem; }
            .contact-info { width: calc(100% - 40px); right: 20px; bottom: 80px; }
            .footer-rights { bottom: 10px; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="space-background">
        <div class="stars"></div>
    </div>

    <header class="top-hud">
        <div class="logo-section">
            <div class="logo-orb"></div>
            <h1 class="project-title">Orbital Mind</h1>
        </div>
        <div class="stats-display">
            <!-- Stats will be injected by JS -->
        </div>
    </header>

    <canvas id="orbital-canvas"></canvas>

    <div class="control-panel">
        <button class="btn btn-primary" id="add-node" title="إضافة فكرة جديدة">➕ فكرة جديدة</button>
        <button class="btn" id="zoom-in">🔍 تكبير</button>
        <button class="btn" id="zoom-out">🔍 تصغير</button>
        <button class="btn" id="reset-view">🏠 إعادة الضبط</button>
    </div>

    <div class="contact-info">
        <div>📧 <a href="mailto:fcab8090@gmail.com">fcab8090@gmail.com</a></div>
        <div>📞 <a href="tel:+251957333692">+251 95 733 3692</a></div>
    </div>

    <div class="footer-rights">
        جميع الحقوق محفوظة لدى Abdulelh Ghwaith &copy; 2026
    </div>

    <!-- Scripts -->
    <script src="js/physics-engine.js"></script>
    <script src="js/node-system.js"></script>
    <script src="js/connection-manager.js"></script>
    <script src="js/storage-manager.js"></script>
    <script src="js/interaction-handler.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
