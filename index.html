<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orbital Mind | نظام العقل المداري</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #fff;
        }
        .space-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 50%, #050508 100%);
            z-index: 0;
        }
        .stars {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 230px 80px, #fff, transparent),
                radial-gradient(2px 2px at 300px 150px, rgba(255,255,255,0.7), transparent);
            background-size: 1000px 300px;
            animation: starMove 200s linear infinite;
        }
        @keyframes starMove {
            from { transform: translate(0, 0); }
            to { transform: translate(-500px, -150px); }
        }
        .nebula {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            filter: blur(40px);
            opacity: 0.6;
            animation: nebulaPulse 15s ease-in-out infinite;
        }
        @keyframes nebulaPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        #orbital-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }
        #orbital-canvas:active {
            cursor: grabbing;
        }
        .top-hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(10, 10, 15, 0.9) 0%, transparent 100%);
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-orb {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(34, 211, 238, 0.3));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: orbPulse 3s ease-in-out infinite;
        }
        .logo-orb::before {
            content: '●';
            color: #22D3EE;
            font-size: 14px;
        }
        @keyframes orbPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
            50% { box-shadow: 0 0 30px rgba(34, 211, 238, 0.6); }
        }
        .project-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #22D3EE, #6366F1, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stats-display {
            display: flex;
            gap: 25px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 15px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #22D3EE;
            font-family: monospace;
        }
        .stat-label {
            font-size: 0.65rem;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .control-section {
            display: flex;
            gap: 8px;
        }
        .control-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 8px;
            background: rgba(99, 102, 241, 0.1);
            color: #94A3B8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .control-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            color: #22D3EE;
            transform: translateY(-2px);
        }
        .control-btn svg {
            width: 18px;
            height: 18px;
        }
        .control-btn.accent {
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            color: white;
            border: none;
        }
        .control-btn.accent:hover {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }
        .minimap-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(10, 10, 15, 0.9);
            border: 2px solid rgba(99, 102, 241, 0.3);
            overflow: hidden;
            z-index: 50;
        }
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
        .input-floating-panel {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 300px;
            background: rgba(15, 18, 25, 0.95);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(99, 102, 241, 0.2);
            z-index: 80;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .input-floating-panel.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            visibility: visible;
        }
        .input-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .input-header h3 {
            font-size: 1rem;
            color: #22D3EE;
        }
        .input-type-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .type-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            background: rgba(99, 102, 241, 0.1);
            color: #94A3B8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .type-btn svg {
            width: 20px;
            height: 20px;
        }
        .type-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            color: #22D3EE;
        }
        .type-btn.active {
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            color: white;
            border: none;
        }
        #node-content {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 10px;
            background: rgba(11, 14, 20, 0.8);
            color: #fff;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        #node-content:focus {
            border-color: #6366F1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }
        #node-content::placeholder {
            color: #64748B;
        }
        .input-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-btn.primary {
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            color: white;
        }
        .action-btn.primary:hover {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }
        .action-btn.secondary {
            background: rgba(99, 102, 241, 0.1);
            color: #94A3B8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        .action-btn.secondary:hover {
            background: rgba(99, 102, 241, 0.2);
            color: #fff;
        }
        .black-hole {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            z-index: 60;
            opacity: 0.8;
        }
        .event-horizon {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #000 40%, #1a1a2e 70%, transparent 100%);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(139, 92, 246, 0.3);
            animation: blackHolePulse 2s ease-in-out infinite;
        }
        @keyframes blackHolePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .accretion-disk {
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #6366F1;
            border-bottom-color: #8B5CF6;
            animation: diskSpin 3s linear infinite;
        }
        @keyframes diskSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .delete-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            color: #64748B;
            white-space: nowrap;
        }
        .welcome-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 18, 25, 0.98);
            border-radius: 20px;
            padding: 30px 40px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(99, 102, 241, 0.2);
            z-index: 300;
            max-width: 450px;
            animation: toastAppear 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes toastAppear {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .toast-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #6366F1, #22D3EE);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .toast-icon svg {
            width: 28px;
            height: 28px;
            color: white;
        }
        .toast-content h4 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #fff;
        }
        .toast-content p {
            font-size: 0.9rem;
            color: #94A3B8;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .toast-hints {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .toast-hints span {
            font-size: 0.75rem;
            padding: 5px 10px;
            background: rgba(99, 102, 241, 0.15);
            border-radius: 20px;
            color: #22D3EE;
        }
        .toast-close {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 6px;
            background: rgba(99, 102, 241, 0.1);
            color: #64748B;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .toast-close:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #EF4444;
        }
        .info-panel {
            position: fixed;
            top: 80px;
            left: 20px;
            width: 260px;
            background: rgba(15, 18, 25, 0.95);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 80;
            opacity: 0;
            transform: translateX(-20px);
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .info-panel.active {
            opacity: 1;
            transform: translateX(0);
            visibility: visible;
        }
        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
        }
        .info-header h3 {
            font-size: 1rem;
            color: #22D3EE;
        }
        .close-btn {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 6px;
            background: rgba(99, 102, 241, 0.1);
            color: #94A3B8;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .close-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #EF4444;
        }
        .info-field {
            margin-bottom: 12px;
        }
        .info-field label {
            display: block;
            font-size: 0.7rem;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .info-field p {
            font-size: 0.9rem;
            color: #fff;
            word-break: break-word;
        }
        .info-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(99, 102, 241, 0.2);
        }
        .info-actions .action-btn {
            flex: 1;
            padding: 10px;
            font-size: 0.8rem;
        }
        .context-menu {
            position: fixed;
            background: rgba(15, 18, 25, 0.98);
            border-radius: 12px;
            padding: 8px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 200;
            opacity: 0;
            transform: scale(0.9);
            visibility: hidden;
            transition: all 0.2s ease;
            min-width: 160px;
        }
        .context-menu.active {
            opacity: 1;
            transform: scale(1);
            visibility: visible;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #94A3B8;
            font-size: 0.9rem;
        }
        .menu-item:hover {
            background: rgba(99, 102, 241, 0.15);
            color: #fff;
        }
        .menu-item svg {
            width: 16px;
            height: 16px;
        }
        .menu-item.danger {
            color: #EF4444;
        }
        .menu-item.danger:hover {
            background: rgba(239, 68, 68, 0.15);
        }
        .fab-new {
            position: fixed;
            bottom: 90px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 55;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fab-new:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.6);
        }
        @media (max-width: 768px) {
            .top-hud { height: 55px; padding: 0 15px; }
            .project-title { font-size: 1.1rem; }
            .stats-display { display: none; }
            .input-floating-panel { width: calc(100% - 40px); right: 20px; bottom: 70px; }
            .minimap-container { width: 80px; height: 80px; bottom: 15px; }
            .welcome-toast { width: calc(100% - 40px); max-width: none; padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="space-background">
        <div class="stars"></div>
        <div class="nebula"></div>
    </div>
    <canvas id="orbital-canvas"></canvas>
    <header class="top-hud">
        <div class="logo-section">
            <div class="logo-orb"></div>
            <span class="project-title">Orbital Mind</span>
        </div>
        <div class="stats-display">
            <div class="stat-item">
                <span class="stat-value" id="node-count">0</span>
                <span class="stat-label">فكرة</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="connection-count">0</span>
                <span class="stat-label">رابط</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="fps-counter">60</span>
                <span class="stat-label">إطار/ث</span>
            </div>
        </div>
        <div class="control-section">
                <button class="control-btn" id="theme-toggle" title="تبديل المظهر">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            <button class="control-btn" id="zoom-in-btn" title="تكبير">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/>
                </svg>
            </button>
            <button class="control-btn" id="zoom-out-btn" title="تصغير">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/>
                </svg>
            </button>
            <button class="control-btn" id="reset-view-btn" title="إعادة تعيين">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
                </svg>
            </button>
            <button class="control-btn accent" id="auto-organize-btn" title="تنظيم تلقائي">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/><path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6"/>
                </svg>
            </button>
        </div>
    </header>
    <div class="minimap-container">
        <canvas id="minimap-canvas"></canvas>
    </div>
    <button class="fab-new" id="fab-new" title="إنشاء فكرة جديدة">+</button>
    <div class="input-floating-panel" id="input-panel">
        <div class="input-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="2" width="20" height="20">
                <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
            </svg>
            <h3>إنشاء فكرة جديدة</h3>
        </div>
        <div class="input-type-selector">
            <button class="type-btn active" data-type="text" title="نص">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 7V4h16v3M9 20h6M12 4v16"/>
                </svg>
            </button>
            <button class="type-btn" data-type="image" title="صورة">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
                </svg>
            </button>
            <button class="type-btn" data-type="link" title="رابط">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
            </button>
        </div>
        <textarea id="node-content" placeholder="اكتب فكرتك هنا..." rows="3"></textarea>
        <div class="input-actions">
            <button class="action-btn secondary" id="cancel-node">إلغاء</button>
            <button class="action-btn primary" id="create-node">إنشاء</button>
        </div>
    </div>
    <div class="info-panel" id="info-panel">
        <div class="info-header">
            <h3>معلومات الفكرة</h3>
            <button class="close-btn" id="close-info">&times;</button>
        </div>
        <div class="info-content">
            <div class="info-field">
                <label>النص</label>
                <p id="info-text">-</p>
            </div>
            <div class="info-field">
                <label>النوع</label>
                <p id="info-type">-</p>
            </div>
            <div class="info-field">
                <label>الروابط</label>
                <p id="info-connections">-</p>
            </div>
            <div class="info-field">
                <label>تاريخ الإنشاء</label>
                <p id="info-date">-</p>
            </div>
        </div>
        <div class="info-actions">
            <button class="action-btn danger" id="delete-node">حذف</button>
            <button class="action-btn secondary" id="duplicate-node">تكرار</button>
        </div>
    </div>
    <div class="context-menu" id="context-menu">
        <div class="menu-item" data-action="edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            <span>تعديل</span>
        </div>
        <div class="menu-item" data-action="connect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.5 8.5l7 7"/>
            </svg>
            <span>ربط</span>
        </div>
        <div class="menu-item" data-action="duplicate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span>تكرار</span>
        </div>
        <div class="menu-item" data-action="color">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="13.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="10.5" r="2.5"/><circle cx="8.5" cy="7.5" r="2.5"/><circle cx="6.5" cy="12.5" r="2.5"/>
            </svg>
            <span>تغيير اللون</span>
        </div>
        <div class="menu-item danger" data-action="delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            <span>حذف</span>
        </div>
    </div>
    <div class="black-hole" id="black-hole">
        <div class="event-horizon"></div>
        <div class="accretion-disk"></div>
        <span class="delete-label">اسحب للحذف</span>
    </div>
    <div class="welcome-toast" id="welcome-toast">
        <button class="toast-close" id="close-welcome">&times;</button>
        <div class="toast-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
            </svg>
        </div>
        <div class="toast-content">
            <h4>مرحباً في Orbital Mind</h4>
            <p>أنشئ أفكارك ككواكب وربطها بقوانين الجاذبية</p>
            <div class="toast-hints">
                <span>⌘ + نقر مزدوج للإنشاء</span>
                <span>سحب لربط الأفكار</span>
            </div>
        </div>
    </div>
    <script>
    class OrbitalMind {
        constructor() {
            this.canvas = document.getElementById('orbital-canvas');
            this.ctx = this.canvas.getContext('2d');
            this.minimapCanvas = document.getElementById('minimap-canvas');
            this.minimapCtx = this.minimapCanvas.getContext('2d');
            this.nodes = [];
            this.connections = [];
            this.nodeCounter = 0;
            this.selectedNode = null;
            this.draggedNode = null;
            this.isConnecting = false;
            this.connectStartNode = null;
            this.view = { x: 0, y: 0, zoom: 1 };
            this.mousePos = { x: 0, y: 0 };
            this.isDragging = false;
            this.frameCount = 0;
            this.fps = 60;
            this.lastFpsUpdate = Date.now();
            this.colors = ['#3B82F6', '#6366F1', '#8B5CF6', '#EC4899', '#22D3EE', '#10B981', '#F59E0B', '#EF4444'];
            this.init();
        }
        
        init() {
            this.resize();
            window.addEventListener('resize', () => this.resize());
            this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
            this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
            this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e));
            this.canvas.addEventListener('dblclick', (e) => this.handleDoubleClick(e));
            this.canvas.addEventListener('contextmenu', (e) => this.handleContextMenu(e));
            this.canvas.addEventListener('wheel', (e) => this.handleWheel(e), { passive: false });
            this.canvas.addEventListener('touchstart', (e) => this.handleTouchStart(e), { passive: false });
            this.canvas.addEventListener('touchmove', (e) => this.handleTouchMove(e), { passive: false });
            this.canvas.addEventListener('touchend', (e) => this.handleTouchEnd(e));
            document.addEventListener('keydown', (e) => this.handleKeyDown(e));
            this.setupUI();
            this.showWelcome();
            this.animate();
            setInterval(() => {
                this.fps = this.frameCount;
                this.frameCount = 0;
                document.getElementById('fps-counter').textContent = this.fps;
            }, 1000);
        }
        
        resize() {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
            this.minimapCanvas.width = 120;
            this.minimapCanvas.height = 120;
        }
        
        setupUI() {
            document.getElementById('zoom-in-btn').addEventListener('click', () => this.zoom(1.2));
            document.getElementById('zoom-out-btn').addEventListener('click', () => this.zoom(0.8));
            document.getElementById('reset-view-btn').addEventListener('click', () => this.resetView());
            document.getElementById('auto-organize-btn').addEventListener('click', () => this.autoOrganize());
            document.getElementById('fab-new').addEventListener('click', () => this.showInputPanel());
            document.getElementById('create-node').addEventListener('click', () => this.createNodeFromInput());
            document.getElementById('cancel-node').addEventListener('click', () => this.hideInputPanel());
            document.getElementById('node-content').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.createNodeFromInput(); }
                if (e.key === 'Escape') this.hideInputPanel();
            });
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            document.getElementById('close-info').addEventListener('click', () => this.hideInfoPanel());
            document.getElementById('delete-node').addEventListener('click', () => this.deleteSelectedNode());
            document.getElementById('duplicate-node').addEventListener('click', () => this.duplicateSelectedNode());
            document.getElementById('close-welcome').addEventListener('click', () => {
                document.getElementById('welcome-toast').style.display = 'none';
                localStorage.setItem('orbital-mind-visited', 'true');
            });
            document.querySelectorAll('.menu-item').forEach(item => {
                item.addEventListener('click', () => this.handleContextAction(item.dataset.action));
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.context-menu')) {
                    document.getElementById('context-menu').classList.remove('active');
                }
            });
        }
        
        handleMouseDown(e) {
            const worldPos = this.screenToWorld(e.clientX, e.clientY);
            if (e.button === 2) {
                this.isDragging = true;
                this.dragStart = { x: e.clientX - this.view.x, y: e.clientY - this.view.y };
                this.canvas.style.cursor = 'grabbing';
            } else {
                const node = this.getNodeAt(worldPos.x, worldPos.y);
                if (node) {
                    if (this.isConnecting && this.connectStartNode && this.connectStartNode.id !== node.id) {
                        this.createConnection(this.connectStartNode, node);
                        this.isConnecting = false;
                        this.connectStartNode = null;
                    } else {
                        this.selectNode(node);
                        this.draggedNode = node;
                        this.dragOffset = { x: worldPos.x - node.x, y: worldPos.y - node.y };
                    }
                } else {
                    this.deselectNode();
                    if (!e.shiftKey) this.isConnecting = false;
                }
            }
        }
        
        handleMouseMove(e) {
            const worldPos = this.screenToWorld(e.clientX, e.clientY);
            this.mousePos = worldPos;
            if (this.isDragging) {
                this.view.x = e.clientX - this.dragStart.x;
                this.view.y = e.clientY - this.dragStart.y;
            } else if (this.draggedNode) {
                this.draggedNode.x = worldPos.x - this.dragOffset.x;
                this.draggedNode.y = worldPos.y - this.dragOffset.y;
            } else {
                const node = this.getNodeAt(worldPos.x, worldPos.y);
                this.canvas.style.cursor = node ? 'pointer' : 'grab';
            }
        }
        
        handleMouseUp(e) {
            if (this.draggedNode) {
                const blackHole = document.getElementById('black-hole');
                const rect = blackHole.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    this.deleteNode(this.draggedNode);
                }
            }
            this.isDragging = false;
            this.draggedNode = null;
            this.canvas.style.cursor = 'grab';
        }
        
        handleDoubleClick(e) {
            const worldPos = this.screenToWorld(e.clientX, e.clientY);
            const node = this.getNodeAt(worldPos.x, worldPos.y);
            if (!node) this.showInputPanelAt(worldPos.x, worldPos.y);
        }
        
        handleContextMenu(e) {
            e.preventDefault();
            const worldPos = this.screenToWorld(e.clientX, e.clientY);
            const node = this.getNodeAt(worldPos.x, worldPos.y);
            if (node) {
                this.selectNode(node);
                this.showContextMenu(node, { x: e.clientX, y: e.clientY });
            }
        }
        
        handleWheel(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            this.zoom(delta, e.clientX, e.clientY);
        }
        
        handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const worldPos = this.screenToWorld(touch.clientX, touch.clientY);
            const node = this.getNodeAt(worldPos.x, worldPos.y);
            if (node) {
                this.selectNode(node);
                this.draggedNode = node;
                this.dragOffset = { x: worldPos.x - node.x, y: worldPos.y - node.y };
            }
        }
        
        handleTouchMove(e) {
            e.preventDefault();
            if (this.draggedNode) {
                const touch = e.touches[0];
                const worldPos = this.screenToWorld(touch.clientX, touch.clientY);
                this.draggedNode.x = worldPos.x - this.dragOffset.x;
                this.draggedNode.y = worldPos.y - this.dragOffset.y;
            }
        }
        
        handleTouchEnd(e) {
            this.draggedNode = null;
        }
        
        handleKeyDown(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            switch (e.key) {
                case 'Delete':
                case 'Backspace':
                    if (this.selectedNode) this.deleteNode(this.selectedNode);
                    break;
                case 'Escape':
                    this.hideInputPanel();
                    this.hideInfoPanel();
                    this.deselectNode();
                    this.isConnecting = false;
                    break;
                case 'n':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        this.showInputPanel();
                    }
                    break;
                case 's':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        this.save();
                    }
                    break;
                case ' ':
                    e.preventDefault();
                    this.centerView();
                    break;
            }
        }
        
        createNode(x, y, content = 'فكرة جديدة', type = 'text') {
            const node = {
                id: `node-${++this.nodeCounter}-${Date.now()}`,
                x, y,
                content,
                type,
                color: this.colors[Math.floor(Math.random() * this.colors.length)],
                size: 60 + Math.sqrt(content.length) * 5,
                createdAt: new Date().toISOString()
            };
            node.size = Math.max(50, Math.min(150, node.size));
            this.nodes.push(node);
            this.updateStats();
            this.save();
            return node;
        }
        
        deleteNode(node) {
            this.connections = this.connections.filter(c => c.source.id !== node.id && c.target.id !== node.id);
            this.nodes = this.nodes.filter(n => n.id !== node.id);
            if (this.selectedNode?.id === node.id) this.selectedNode = null;
            this.updateStats();
            this.save();
        }
        
        selectNode(node) {
            this.selectedNode = node;
            this.showInfoPanel(node);
        }
        
        deselectNode() {
            this.selectedNode = null;
            this.hideInfoPanel();
        }
        
        getNodeAt(x, y) {
            for (const node of this.nodes) {
                const dist = Math.sqrt((x - node.x) ** 2 + (y - node.y) ** 2);
                if (dist <= node.size / 2 + 10) return node;
            }
            return null;
        }
        
        createConnection(node1, node2) {
            if (node1.id === node2.id) return;
            const exists = this.connections.some(c => (c.source.id === node1.id && c.target.id === node2.id) || (c.source.id === node2.id && c.target.id === node1.id));
            if (!exists) {
                this.connections.push({ id: `conn-${Date.now()}`, source: node1, target: node2, strength: 2 });
                this.updateStats();
                this.save();
            }
        }
        
        animate() {
            this.frameCount++;
            this.ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            this.ctx.save();
            this.ctx.translate(this.view.x, this.view.y);
            this.ctx.scale(this.view.zoom, this.view.zoom);
            this.drawConnections();
            this.drawNodes();
            if (this.isConnecting && this.connectStartNode) this.drawTempConnection();
            this.ctx.restore();
            this.drawMinimap();
            requestAnimationFrame(() => this.animate());
        }
        
        drawNodes() {
            for (const node of this.nodes) {
                this.ctx.save();
                this.ctx.translate(node.x, node.y);
                if (this.selectedNode?.id === node.id) {
                    const gradient = this.ctx.createRadialGradient(0, 0, node.size * 0.3, 0, 0, node.size);
                    gradient.addColorStop(0, node.color + '40');
                    gradient.addColorStop(1, 'transparent');
                    this.ctx.fillStyle = gradient;
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, node.size * 0.8, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                const bodyGradient = this.ctx.createRadialGradient(-node.size * 0.15, -node.size * 0.15, 0, 0, 0, node.size / 2);
                bodyGradient.addColorStop(0, this.lightenColor(node.color, 20));
                bodyGradient.addColorStop(1, node.color);
                this.ctx.fillStyle = bodyGradient;
                this.ctx.beginPath();
                this.ctx.arc(0, 0, node.size / 2, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.strokeStyle = this.selectedNode?.id === node.id ? '#22D3EE' : 'rgba(255,255,255,0.2)';
                this.ctx.lineWidth = this.selectedNode?.id === node.id ? 2 : 1;
                this.ctx.stroke();
                if (node.content && node.type === 'text') {
                    const fontSize = Math.max(10, node.size * 0.12);
                    this.ctx.font = `${fontSize}px Cairo, sans-serif`;
                    this.ctx.fillStyle = '#fff';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.wrapText(node.content, 0, 0, node.size * 0.7, fontSize * 1.3);
                }
                this.ctx.restore();
            }
        }
        
        drawConnections() {
            for (const conn of this.connections) {
                const { source, target, strength } = conn;
                this.ctx.beginPath();
                this.ctx.moveTo(source.x, source.y);
                const midX = (source.x + target.x) / 2;
                const midY = (source.y + target.y) / 2;
                const dx = target.x - source.x;
                const dy = target.y - source.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const curve = Math.min(dist * 0.1, 30);
                const perpX = -dy / dist * curve;
                const perpY = dx / dist * curve;
                this.ctx.quadraticCurveTo(midX + perpX, midY + perpY, target.x, target.y);
                if (strength >= 4) {
                    this.ctx.strokeStyle = '#22D3EE';
                    this.ctx.shadowColor = '#22D3EE';
                    this.ctx.shadowBlur = 10;
                } else if (strength >= 3) {
                    this.ctx.strokeStyle = 'rgba(99, 102, 241, 0.9)';
                    this.ctx.shadowBlur = 5;
                } else if (strength >= 2) {
                    this.ctx.strokeStyle = 'rgba(99, 102, 241, 0.7)';
                    this.ctx.shadowBlur = 0;
                } else {
                    this.ctx.strokeStyle = 'rgba(100, 116, 139, 0.5)';
                    this.ctx.shadowBlur = 0;
                }
                this.ctx.lineWidth = strength * 0.8;
                this.ctx.lineCap = 'round';
                this.ctx.stroke();
                this.ctx.shadowBlur = 0;
            }
        }
        
        drawTempConnection() {
            this.ctx.beginPath();
            this.ctx.moveTo(this.connectStartNode.x, this.connectStartNode.y);
            this.ctx.lineTo(this.mousePos.x, this.mousePos.y);
            this.ctx.strokeStyle = 'rgba(34, 211, 238, 0.8)';
            this.ctx.lineWidth = 2;
            this.ctx.setLineDash([8, 4]);
            this.ctx.stroke();
            this.ctx.setLineDash([]);
        }
        
        drawMinimap() {
            const ctx = this.minimapCtx;
            const w = 120, h = 120;
            ctx.fillStyle = 'rgba(10, 10, 15, 0.9)';
            ctx.fillRect(0, 0, w, h);
            if (this.nodes.length === 0) return;
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            this.nodes.forEach(n => {
                minX = Math.min(minX, n.x);
                maxX = Math.max(maxX, n.x);
                minY = Math.min(minY, n.y);
                maxY = Math.max(maxY, n.y);
            });
            const rangeX = maxX - minX || 1;
            const rangeY = maxY - minY || 1;
            const scale = Math.min(100 / rangeX, 100 / rangeY);
            const offsetX = w / 2 - (minX + maxX) / 2 * scale;
            const offsetY = h / 2 - (minY + maxY) / 2 * scale;
            this.nodes.forEach(node => {
                ctx.fillStyle = node.color;
                ctx.beginPath();
                ctx.arc(offsetX + node.x * scale, offsetY + node.y * scale, Math.max(2, node.size * scale * 0.3), 0, Math.PI * 2);
                ctx.fill();
            });
            const viewW = w / this.view.zoom;
            const viewH = h / this.view.zoom;
            const viewX = w / 2 - this.view.x / this.view.zoom * scale;
            const viewY = h / 2 - this.view.y / this.view.zoom * scale;
            ctx.strokeStyle = '#22D3EE';
            ctx.lineWidth = 1;
            ctx.strokeRect(viewX - viewW / 2, viewY - viewH / 2, viewW, viewH);
        }
        
        wrapText(text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let startY = y - (lineHeight * (Math.ceil(text.length / 10) / 2));
            for (let i = 0; i < words.length; i++) {
                const testLine = line + words[i] + ' ';
                const metrics = this.ctx.measureText(testLine);
                if (metrics.width > maxWidth && i > 0) {
                    this.ctx.fillText(line, x, startY);
                    line = words[i] + ' ';
                    startY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            this.ctx.fillText(line, x, startY);
        }
        
        screenToWorld(screenX, screenY) {
            return { x: (screenX - this.view.x) / this.view.zoom, y: (screenY - this.view.y) / this.view.zoom };
        }
        
        zoom(factor, centerX, centerY) {
            const worldBefore = this.screenToWorld(centerX, centerY);
            this.view.zoom = Math.max(0.2, Math.min(3, this.view.zoom * factor));
            const worldAfter = this.screenToWorld(centerX, centerY);
            this.view.x += (worldAfter.x - worldBefore.x) * this.view.zoom;
            this.view.y += (worldAfter.y - worldBefore.y) * this.view.zoom;
        }
        
        resetView() {
            this.view = { x: 0, y: 0, zoom: 1 };
        }
        
        centerView() {
            if (this.nodes.length === 0) { this.resetView(); return; }
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            this.nodes.forEach(n => {
                minX = Math.min(minX, n.x);
                minY = Math.min(minY, n.y);
                maxX = Math.max(maxX, n.x);
                maxY = Math.max(maxY, n.y);
            });
            const centerX = (minX + maxX) / 2;
            const centerY = (minY + maxY) / 2;
            const width = maxX - minX + 200;
            const height = maxY - minY + 200;
            this.view.zoom = Math.min(this.canvas.width / width, this.canvas.height / height, 2);
            this.view.x = this.canvas.width / 2 - centerX * this.view.zoom;
            this.view.y = this.canvas.height / 2 - centerY * this.view.zoom;
        }
        
        autoOrganize() {
            const angleStep = (Math.PI * 2) / this.nodes.length;
            const radius = Math.min(200, 50 + this.nodes.length * 20);
            this.nodes.forEach((node, i) => {
                const angle = i * angleStep;
                node.x = Math.cos(angle) * radius;
                node.y = Math.sin(angle) * radius;
            });
        }
        
        lightenColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, (num >> 16) + amt);
            const G = Math.min(255, (num >> 8 & 0x00FF) + amt);
            const B = Math.min(255, (num & 0x0000FF) + amt);
            return `rgb(${R},${G},${B})`;
        }
        
        showInputPanel() {
            document.getElementById('input-panel').classList.add('active');
            document.getElementById('node-content').focus();
        }
        
        showInputPanelAt(x, y) {
            this.tempNodePos = { x, y };
            this.showInputPanel();
        }
        
        hideInputPanel() {
            document.getElementById('input-panel').classList.remove('active');
            document.getElementById('node-content').value = '';
        }
        
        createNodeFromInput() {
            const textarea = document.getElementById('node-content');
            const content = textarea.value.trim();
            if (!content) return;
            let x, y;
            if (this.tempNodePos) {
                x = this.tempNodePos.x;
                y = this.tempNodePos.y;
                this.tempNodePos = null;
            } else {
                const center = this.screenToWorld(this.canvas.width / 2, this.canvas.height / 2);
                x = center.x + (Math.random() - 0.5) * 100;
                y = center.y + (Math.random() - 0.5) * 100;
            }
            const type = document.querySelector('.type-btn.active').dataset.type;
            this.createNode(x, y, content, type);
            this.hideInputPanel();
        }
        
        showInfoPanel(node) {
            document.getElementById('info-text').textContent = node.content || '-';
            document.getElementById('info-type').textContent = this.getTypeName(node.type);
            document.getElementById('info-connections').textContent = this.connections.filter(c => c.source.id === node.id || c.target.id === node.id).length;
            document.getElementById('info-date').textContent = new Date(node.createdAt).toLocaleDateString('ar-SA');
            document.getElementById('info-panel').classList.add('active');
        }
        
        hideInfoPanel() {
            document.getElementById('info-panel').classList.remove('active');
        }
        
        showContextMenu(node, pos) {
            this.selectNode(node);
            const menu = document.getElementById('context-menu');
            menu.style.left = pos.x + 'px';
            menu.style.top = pos.y + 'px';
            menu.classList.add('active');
        }
        
        handleContextAction(action) {
            if (!this.selectedNode) return;
            switch (action) {
                case 'edit':
                    this.showInputPanelAt(this.selectedNode.x, this.selectedNode.y);
                    document.getElementById('node-content').value = this.selectedNode.content;
                    this.deleteNode(this.selectedNode);
                    break;
                case 'connect':
                    this.isConnecting = true;
                    this.connectStartNode = this.selectedNode;
                    break;
                case 'duplicate':
                    this.createNode(this.selectedNode.x + 50, this.selectedNode.y + 50, this.selectedNode.content, this.selectedNode.type);
                    break;
                case 'color':
                    const currentIndex = this.colors.indexOf(this.selectedNode.color);
                    this.selectedNode.color = this.colors[(currentIndex + 1) % this.colors.length];
                    break;
                case 'delete':
                    this.deleteNode(this.selectedNode);
                    break;
            }
            document.getElementById('context-menu').classList.remove('active');
        }
        
        deleteSelectedNode() {
            if (this.selectedNode) {
                this.deleteNode(this.selectedNode);
                this.hideInfoPanel();
            }
        }
        
        duplicateSelectedNode() {
            if (this.selectedNode) {
                this.createNode(this.selectedNode.x + 50, this.selectedNode.y + 50, this.selectedNode.content, this.selectedNode.type);
                this.hideInfoPanel();
            }
        }
        
        getTypeName(type) {
            const names = { 'text': 'نص', 'image': 'صورة', 'link': 'رابط' };
            return names[type] || type;
        }
        
        showWelcome() {
            const hasVisited = localStorage.getItem('orbital-mind-visited');
            if (!hasVisited) {
                setTimeout(() => { document.getElementById('welcome-toast').style.display = 'flex'; }, 500);
            }
        }
        
        updateStats() {
            document.getElementById('node-count').textContent = this.nodes.length;
            document.getElementById('connection-count').textContent = this.connections.length;
        }
        
        save() {
            const data = {
                nodes: this.nodes,
                connections: this.connections.map(c => ({ id: c.id, sourceId: c.source.id, targetId: c.target.id, strength: c.strength })),
                nodeCounter: this.nodeCounter,
                view: this.view
            };
            localStorage.setItem('orbital-mind-data', JSON.stringify(data));
        }
        
        load() {
            try {
                const data = JSON.parse(localStorage.getItem('orbital-mind-data'));
                if (!data) return;
                this.nodeCounter = data.nodeCounter || 0;
                this.view = data.view || { x: 0, y: 0, zoom: 1 };
                this.nodes = data.nodes || [];
                if (data.connections) {
                    this.connections = data.connections.map(c => {
                        const source = this.nodes.find(n => n.id === c.sourceId);
                        const target = this.nodes.find(n => n.id === c.targetId);
                        if (source && target) return { ...c, source, target };
                        return null;
                    }).filter(Boolean);
                }
                this.updateStats();
            } catch (e) { console.warn('فشل تحميل البيانات:', e); }
        }
    }
    document.addEventListener('DOMContentLoaded', () => {
        window.app = new OrbitalMind();
        window.app.load();
    });
    </script>
</body>
</html>
